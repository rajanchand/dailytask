# Production stack: Postgres + Redis + Next.js app (+ optional worker / Discord bot)
#
# Usage:
#   cp .env.example .env
#   docker compose -f docker-compose.prod.yml --profile worker up -d --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dailyflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dailyflow}
      POSTGRES_DB: ${POSTGRES_DB:-dailyflow}
    volumes:
      - dailyflow_pg_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - dailyflow

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - dailyflow_redis_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - dailyflow

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-dailyflow}:${POSTGRES_PASSWORD:-dailyflow}@postgres:5432/${POSTGRES_DB:-dailyflow}
      REDIS_URL: redis://redis:6379
      PORT: "3000"
      UPLOAD_DIR: /app/uploads
      RUN_SEED: ${RUN_SEED:-true}
    volumes:
      - dailyflow_uploads_prod:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dailyflow

  worker:
    profiles: ["worker"]
    build: .
    restart: unless-stopped
    command: ["pnpm", "worker"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-dailyflow}:${POSTGRES_PASSWORD:-dailyflow}@postgres:5432/${POSTGRES_DB:-dailyflow}
      REDIS_URL: redis://redis:6379
      RUN_SEED: "false"
      UPLOAD_DIR: /app/uploads
    volumes:
      - dailyflow_uploads_prod:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - dailyflow

  bot:
    profiles: ["bot"]
    build: .
    restart: unless-stopped
    command: ["pnpm", "discord:bot"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-dailyflow}:${POSTGRES_PASSWORD:-dailyflow}@postgres:5432/${POSTGRES_DB:-dailyflow}
      REDIS_URL: redis://redis:6379
      RUN_SEED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - dailyflow

volumes:
  dailyflow_pg_prod:
  dailyflow_redis_prod:
  dailyflow_uploads_prod:

networks:
  dailyflow:
    driver: bridge
